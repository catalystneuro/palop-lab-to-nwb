[project]
name = "palop-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for Palop lab conversion"
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
  "neuroconv",
  "nwbinspector",
]

[project.urls]
Repository = "https://github.com/catalystneuro/palop-lab-to-nwb"

[project.optional-dependencies]
j20_open_field = [
  "neuroconv[deeplabcut,video]>=0.10.2",
  "ndx-pose>=0.4.0",
  "hdmf-zarr<0.14",  # neuroconv 0.10.2 imports the zarr 2 API; hdmf-zarr 0.14 requires zarr 3
  "pandas",
]

[dependency-groups]
dev = [
  "pre-commit",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "*.yaml",
  "*.yml",
  "*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/palop_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
packages = ["src/palop_lab_to_nwb"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F401",
    "I",
    "UP006",
    "UP007",
    "UP045",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["palop_lab_to_nwb"]

[tool.codespell]
skip = '.git*,*.pdf,*.css'
check-hidden = true
